<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Rulebook RAG</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        
        .profile-selector {
            margin-bottom: 20px;
        }
        
        .profile-selector label {
            font-weight: 600;
            margin-right: 10px;
        }
        
        .profile-selector select {
            padding: 8px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 1em;
            cursor: pointer;
        }
        
        .query-form {
            margin-bottom: 20px;
        }
        
        .query-form textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            font-family: inherit;
            resize: vertical;
            min-height: 100px;
        }
        
        .query-form textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .query-form button {
            margin-top: 15px;
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .query-form button:hover {
            transform: translateY(-2px);
        }
        
        .query-form button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .loading {
            text-align: center;
            color: #667eea;
            font-weight: 600;
            padding: 20px;
        }
        
        .result {
            margin-top: 20px;
        }
        
        .answer {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        
        .sources {
            margin-top: 20px;
        }
        
        .sources h3 {
            margin-bottom: 15px;
            color: #333;
        }
        
        .source {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 3px solid #764ba2;
        }
        
        .source-header {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }
        
        .source-text {
            color: #666;
            font-size: 0.95em;
            line-height: 1.5;
        }
        
        .metadata {
            margin-top: 15px;
            padding: 10px;
            background: #e8eaf6;
            border-radius: 6px;
            font-size: 0.9em;
            color: #666;
        }
        
        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #c33;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏎️ F1 Rulebook RAG</h1>
            <p>Ask questions about the 2026 FIA Formula 1 Regulations</p>
        </div>
        
        <div class="card">
            <div class="profile-selector">
                <label for="profile">Profile:</label>
                <select id="profile">
                    <option value="cloud">Cloud (Gemini)</option>
                    <option value="local">Local (LM Studio)</option>
                </select>
            </div>
            
            <form class="query-form" id="queryForm">
                <textarea 
                    id="question" 
                    placeholder="e.g., What happens if it rains during qualifying?"
                    required
                ></textarea>
                <button type="submit">Ask Question</button>
            </form>
            
            <div id="loading" class="loading" style="display: none;">
                Searching regulations and generating answer...
            </div>
            
            <div id="result" class="result" style="display: none;">
                <div class="answer" id="answer"></div>
                
                <div class="sources" id="sources" style="display: none;">
                    <h3>Sources</h3>
                    <div id="sourcesList"></div>
                </div>
                
                <div class="metadata" id="metadata"></div>
            </div>
            
            <div id="error" class="error" style="display: none;"></div>
        </div>
    </div>
    
    <script>
        const form = document.getElementById('queryForm');
        const questionInput = document.getElementById('question');
        const profileSelect = document.getElementById('profile');
        const loading = document.getElementById('loading');
        const result = document.getElementById('result');
        const answer = document.getElementById('answer');
        const sources = document.getElementById('sources');
        const sourcesList = document.getElementById('sourcesList');
        const metadata = document.getElementById('metadata');
        const errorDiv = document.getElementById('error');
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Reset UI
            loading.style.display = 'block';
            result.style.display = 'none';
            errorDiv.style.display = 'none';
            
            const question = questionInput.value.trim();
            const profile = profileSelect.value;
            
            try {
                const response = await fetch('/query', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ question })
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Query failed');
                }
                
                const data = await response.json();
                
                // Display answer
                answer.textContent = data.answer;
                
                // Display sources
                if (data.sources && data.sources.length > 0) {
                    sourcesList.innerHTML = '';
                    data.sources.forEach((source, index) => {
                        const sourceDiv = document.createElement('div');
                        sourceDiv.className = 'source';
                        
                        let header = `Section ${source.section} [${source.section_name}], Article ${source.article}`;
                        if (source.article_title) {
                            header += `: ${source.article_title}`;
                        }
                        if (source.page) {
                            header += ` (Page ${source.page})`;
                        }
                        
                        sourceDiv.innerHTML = `
                            <div class="source-header">${header}</div>
                            <div class="source-text">${source.text}</div>
                        `;
                        sourcesList.appendChild(sourceDiv);
                    });
                    sources.style.display = 'block';
                } else {
                    sources.style.display = 'none';
                }
                
                // Display metadata
                metadata.textContent = `Model: ${data.metadata.model} | Retrieved: ${data.metadata.chunks_retrieved} chunks | Used: ${data.metadata.chunks_used} chunks | Response time: ${data.metadata.response_time_ms}ms`;
                
                result.style.display = 'block';
            } catch (err) {
                errorDiv.textContent = `Error: ${err.message}`;
                errorDiv.style.display = 'block';
            } finally {
                loading.style.display = 'none';
            }
        });
    </script>
</body>
</html>
