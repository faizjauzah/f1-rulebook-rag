<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>F1 Rulebook RAG</title>

    <!-- Markdown rendering + sanitizing (needs internet; falls back to plain text if blocked) -->
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>

    <style>
      :root {
        --fg: #111;
        --text: #222;
        --muted: #6b6b6b;
        --line: #e4e4e4;
        --soft: #f6f6f6;
        --bg: #fff;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
        padding: 48px 20px 80px;
      }

      .container {
        max-width: 760px;
        margin: 0 auto;
      }

      /* ---------- Header ---------- */
      header {
        margin-bottom: 32px;
      }
      header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--fg);
        letter-spacing: -0.01em;
      }
      header p {
        color: var(--muted);
        margin-top: 4px;
      }
      .status {
        margin-top: 10px;
        font-size: 0.8rem;
        color: var(--muted);
      }

      /* ---------- Form ---------- */
      textarea {
        width: 100%;
        min-height: 96px;
        padding: 14px 16px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font: inherit;
        color: var(--fg);
        resize: vertical;
      }
      textarea:focus {
        outline: none;
        border-color: var(--fg);
      }

      .form-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 12px;
        flex-wrap: wrap;
      }
      .hint {
        font-size: 0.8rem;
        color: var(--muted);
      }

      button.primary {
        background: var(--fg);
        color: #fff;
        border: 1px solid var(--fg);
        border-radius: 8px;
        padding: 10px 22px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button.primary:hover {
        background: #000;
      }
      button.primary:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .examples {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 14px;
      }
      .chip {
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 5px 12px;
        font: inherit;
        font-size: 0.8rem;
        color: var(--text);
        cursor: pointer;
      }
      .chip:hover {
        border-color: var(--fg);
      }

      /* ---------- Loading / error ---------- */
      .loading {
        margin-top: 32px;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .loading::before {
        content: "";
        display: inline-block;
        width: 12px;
        height: 12px;
        margin-right: 8px;
        border: 2px solid var(--line);
        border-top-color: var(--fg);
        border-radius: 50%;
        vertical-align: -2px;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .error {
        margin-top: 32px;
        padding: 14px 16px;
        border: 1px solid var(--fg);
        border-radius: 8px;
        font-size: 0.9rem;
      }

      /* ---------- Sections ---------- */
      .result {
        margin-top: 36px;
      }

      .section-label {
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .answer-card {
        margin-top: 10px;
        padding: 22px 24px;
        border: 1px solid var(--fg);
        border-radius: 10px;
      }

      /* ---------- Markdown ---------- */
      .md > *:first-child {
        margin-top: 0;
      }
      .md > *:last-child {
        margin-bottom: 0;
      }
      .md p,
      .md ul,
      .md ol,
      .md pre,
      .md blockquote,
      .md table {
        margin: 0 0 14px;
      }
      .md h1,
      .md h2,
      .md h3,
      .md h4 {
        color: var(--fg);
        line-height: 1.3;
        margin: 22px 0 8px;
      }
      .md h1 {
        font-size: 1.25rem;
      }
      .md h2 {
        font-size: 1.1rem;
      }
      .md h3,
      .md h4 {
        font-size: 1rem;
      }
      .md ul,
      .md ol {
        padding-left: 22px;
      }
      .md li {
        margin: 4px 0;
      }
      .md strong {
        color: var(--fg);
      }
      .md a {
        color: var(--fg);
        text-decoration: underline;
      }
      .md code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.88em;
        background: var(--soft);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 1px 5px;
      }
      .md pre {
        background: var(--soft);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px 14px;
        overflow-x: auto;
      }
      .md pre code {
        background: none;
        border: none;
        padding: 0;
      }
      .md blockquote {
        border-left: 3px solid var(--fg);
        padding: 2px 0 2px 14px;
        color: #444;
      }
      .md hr {
        border: none;
        border-top: 1px solid var(--line);
        margin: 18px 0;
      }
      .md table {
        border-collapse: collapse;
        width: 100%;
        font-size: 0.92rem;
      }
      .md th,
      .md td {
        border: 1px solid var(--line);
        padding: 7px 10px;
        text-align: left;
        vertical-align: top;
      }
      .md th {
        background: var(--soft);
        color: var(--fg);
      }

      /* inline citation [1] -> jumps to source */
      a.cite {
        text-decoration: none;
        font-weight: 600;
        color: var(--fg);
        border-bottom: 1px solid var(--fg);
      }
      a.cite:hover {
        background: var(--fg);
        color: #fff;
      }

      /* ---------- Sources ---------- */
      .sources {
        margin-top: 32px;
      }
      .sources-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }
      .link-btn {
        background: none;
        border: none;
        font: inherit;
        font-size: 0.8rem;
        color: var(--muted);
        text-decoration: underline;
        cursor: pointer;
      }
      .link-btn:hover {
        color: var(--fg);
      }

      .source-list {
        margin-top: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      details.source {
        border: 1px solid var(--line);
        border-radius: 8px;
        transition:
          border-color 0.2s,
          background 0.2s;
      }
      details.source[open] {
        border-color: #bbb;
      }
      details.source.flash {
        border-color: var(--fg);
        background: var(--soft);
      }

      details.source summary {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 12px 14px;
        cursor: pointer;
        list-style: none;
      }
      details.source summary::-webkit-details-marker {
        display: none;
      }
      details.source summary::after {
        content: "+";
        flex: none;
        margin-left: auto;
        color: var(--muted);
        font-size: 1.1rem;
        line-height: 1.3;
      }
      details.source[open] summary::after {
        content: "\2212";
      }

      .badge {
        flex: none;
        min-width: 24px;
        height: 24px;
        padding: 0 6px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--fg);
        border-radius: 6px;
        font-size: 0.8rem;
        font-weight: 700;
        color: var(--fg);
      }

      .source-info {
        min-width: 0;
        flex: 1;
      }
      .source-title {
        font-weight: 600;
        color: var(--fg);
        line-height: 1.35;
      }
      .source-meta {
        font-size: 0.8rem;
        color: var(--muted);
        margin-top: 2px;
      }

      .tag {
        display: inline-block;
        margin-left: 8px;
        padding: 0 6px;
        border: 1px solid var(--fg);
        border-radius: 4px;
        font-size: 0.66rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        vertical-align: 2px;
      }

      /* key passage shown while the card is collapsed */
      .source-preview {
        margin-top: 8px;
        padding-left: 10px;
        border-left: 2px solid #ccc;
        font-size: 0.86rem;
        color: #444;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      details.source[open] .source-preview {
        display: none;
      }

      /* full clause text, shown when expanded */
      .source-body {
        padding: 14px 16px 16px 50px;
        border-top: 1px solid var(--line);
        font-size: 0.92rem;
        color: #333;
      }
      .source-body p {
        margin: 0 0 10px;
        line-height: 1.65;
      }
      .source-body p:last-child {
        margin-bottom: 0;
      }
      .source-body p.hl {
        background: var(--soft);
        border-left: 3px solid var(--fg);
        padding: 8px 12px;
        color: var(--fg);
      }
      .code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.9em;
        font-weight: 600;
        color: var(--fg);
      }
      .legend {
        margin-bottom: 12px;
        font-size: 0.75rem;
        color: var(--muted);
      }
      .legend::before {
        content: "";
        display: inline-block;
        width: 10px;
        height: 10px;
        margin-right: 6px;
        background: var(--soft);
        border-left: 3px solid var(--fg);
      }
      .note {
        margin-top: 12px;
        font-size: 0.78rem;
        color: var(--muted);
      }

      .meta-line {
        margin-top: 28px;
        font-size: 0.78rem;
        color: var(--muted);
      }

      @media (max-width: 520px) {
        body {
          padding-top: 28px;
        }
        .answer-card {
          padding: 16px;
        }
        .source-body {
          padding-left: 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>F1 Rulebook RAG</h1>
        <p>Ask questions about the 2026 FIA Formula 1 Regulations.</p>
        <div class="status" id="status"></div>
      </header>

      <form id="queryForm">
        <textarea id="question" placeholder="e.g., What happens if it rains during qualifying?" required></textarea>
        <div class="form-row">
          <span class="hint">Press Ctrl/Cmd + Enter to ask</span>
          <button type="submit" id="submitBtn" class="primary">Ask</button>
        </div>
        <div class="examples" id="examples"></div>
      </form>

      <div id="loading" class="loading" style="display: none">Searching regulations and generating answer…</div>
      <div id="error" class="error" style="display: none"></div>

      <main id="result" class="result" style="display: none" aria-live="polite">
        <div class="section-label">Answer</div>
        <div class="answer-card"><div id="answer" class="md"></div></div>

        <section id="sources" class="sources" style="display: none">
          <div class="sources-head">
            <div class="section-label" id="sourcesTitle">Sources</div>
            <button type="button" class="link-btn" id="toggleAll">Expand all</button>
          </div>
          <div id="sourceList" class="source-list"></div>
        </section>

        <div class="meta-line" id="metadata"></div>
      </main>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const form = $("queryForm");
      const questionInput = $("question");
      const submitBtn = $("submitBtn");

      const EXAMPLES = ["What happens if it rains during qualifying?", "What does Article C3.5.2 say?", "What is the minimum weight of the car?"];

      // ---------- Setup ----------
      EXAMPLES.forEach((q) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "chip";
        b.textContent = q;
        b.addEventListener("click", () => {
          questionInput.value = q;
          questionInput.focus();
        });
        $("examples").appendChild(b);
      });

      if (window.marked) marked.setOptions({ gfm: true, breaks: true });
      if (window.DOMPurify) {
        DOMPurify.addHook("afterSanitizeAttributes", (node) => {
          if (node.tagName === "A") {
            node.setAttribute("target", "_blank");
            node.setAttribute("rel", "noopener noreferrer");
          }
        });
      }

      fetch("/health")
        .then((r) => r.json())
        .then((h) => {
          $("status").textContent = `${h.chroma_connected ? "●" : "○"} ChromaDB ${h.chroma_connected ? "connected" : "unreachable"} · profile: ${h.profile}`;
        })
        .catch(() => {
          $("status").textContent = "○ API unreachable";
        });

      questionInput.addEventListener("keydown", (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
          e.preventDefault();
          form.requestSubmit();
        }
      });

      // ---------- Markdown ----------
      function renderMarkdown(text, target, sourceCount) {
        if (window.marked && window.DOMPurify) {
          target.style.whiteSpace = "";
          target.innerHTML = DOMPurify.sanitize(marked.parse(text));
          linkCitations(target, sourceCount);
        } else {
          // CDN blocked / offline: still readable as plain text
          target.style.whiteSpace = "pre-wrap";
          target.textContent = text;
        }
      }

      // Turns "[1]", "[Source 2]" or "[Source 1, Source 3]" into links to the source cards.
      function linkCitations(root, count) {
        if (!count) return;
        const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
          acceptNode: (n) => (n.parentElement.closest("code, pre, a") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT),
        });
        const nodes = [];
        while (walker.nextNode()) nodes.push(walker.currentNode);

        nodes.forEach((node) => {
          const re = /\[((?:Sources?\s*)?\d{1,2}(?:\s*,\s*(?:Sources?\s*)?\d{1,2})*)\]/gi;
          const text = node.nodeValue;
          const frag = document.createDocumentFragment();
          let last = 0,
            changed = false,
            m;

          while ((m = re.exec(text)) !== null) {
            const nums = m[1].match(/\d+/g).map(Number);
            if (nums.some((n) => n < 1 || n > count)) continue;
            changed = true;
            frag.append(text.slice(last, m.index), "[");
            nums.forEach((n, i) => {
              if (i) frag.append(", ");
              const a = document.createElement("a");
              a.className = "cite";
              a.href = "#source-" + n;
              a.dataset.source = n;
              a.textContent = n;
              frag.append(a);
            });
            frag.append("]");
            last = m.index + m[0].length;
          }
          if (changed) {
            frag.append(text.slice(last));
            node.replaceWith(frag);
          }
        });
      }

      $("answer").addEventListener("click", (e) => {
        const link = e.target.closest("a.cite");
        if (!link) return;
        e.preventDefault();
        const el = $("source-" + link.dataset.source);
        if (!el) return;
        el.open = true;
        el.scrollIntoView({ behavior: "smooth", block: "center" });
        el.classList.add("flash");
        setTimeout(() => el.classList.remove("flash"), 1600);
        syncToggleLabel();
      });

      // ---------- Sources ----------
      function sourceMeta(s) {
        const parts = [];
        if (s.section && s.section !== "Unknown") {
          const name = s.section_name && s.section_name !== "Unknown" ? ` [${s.section_name}]` : "";
          parts.push(`Section ${s.section}${name}`);
        } else if (s.doc_title) {
          parts.push(s.doc_title);
        }
        if (s.page) parts.push(`p. ${s.page}`);
        if (s.issue) parts.push(`Issue ${s.issue}`);
        if (s.match === "article_number") parts.push("exact article match");
        else if (typeof s.similarity === "number") parts.push(`similarity ${s.similarity.toFixed(2)}`);
        return parts.join(" · ");
      }

      // "C4.1.2 The minimum ..." -> clause number in monospace bold, rest as normal text
      function renderParagraph(text, highlight) {
        const p = document.createElement("p");
        if (highlight) p.className = "hl";
        const m = text.match(/^([A-F]\d+(?:\.\d+)+)(?=\s|$)/);
        if (m) {
          const code = document.createElement("span");
          code.className = "code";
          code.textContent = m[1];
          p.append(code, text.slice(m[1].length));
        } else {
          p.textContent = text;
        }
        return p;
      }

      function renderSources(sources) {
        const list = $("sourceList");
        list.innerHTML = "";

        sources.forEach((s, i) => {
          const num = s.ref || i + 1;
          const paragraphs = s.paragraphs || [];
          const key = paragraphs.find((p) => p.highlight);

          const details = document.createElement("details");
          details.className = "source";
          details.id = "source-" + num;

          // --- collapsed header: number, title, meta, key passage ---
          const summary = document.createElement("summary");

          const badge = document.createElement("span");
          badge.className = "badge";
          badge.textContent = num;

          const info = document.createElement("div");
          info.className = "source-info";

          const title = document.createElement("div");
          title.className = "source-title";
          title.append(s.label || `Article ${s.article}`);
          if (s.cited) {
            const tag = document.createElement("span");
            tag.className = "tag";
            tag.textContent = "Cited";
            title.append(tag);
          }

          const meta = document.createElement("div");
          meta.className = "source-meta";
          meta.textContent = sourceMeta(s);

          info.append(title, meta);

          if (key) {
            const preview = document.createElement("div");
            preview.className = "source-preview";
            preview.textContent = key.text;
            info.append(preview);
          }

          summary.append(badge, info);

          // --- expanded body: full clause, relevant paragraphs highlighted ---
          const body = document.createElement("div");
          body.className = "source-body";

          if (key) {
            const legend = document.createElement("div");
            legend.className = "legend";
            legend.textContent = "Highlighted: the passage most relevant to the answer";
            body.append(legend);
          }
          paragraphs.forEach((p) => body.append(renderParagraph(p.text, p.highlight)));

          if (s.truncated) {
            const note = document.createElement("div");
            note.className = "note";
            note.textContent = "This clause is long, only the first part is shown.";
            body.append(note);
          }

          details.append(summary, body);
          details.addEventListener("toggle", syncToggleLabel);
          list.appendChild(details);
        });

        $("sourcesTitle").textContent = `Sources (${sources.length})`;
        $("sources").style.display = "block";
        syncToggleLabel();
      }

      function syncToggleLabel() {
        const all = document.querySelectorAll("details.source");
        const allOpen = all.length > 0 && [...all].every((d) => d.open);
        $("toggleAll").textContent = allOpen ? "Collapse all" : "Expand all";
      }

      $("toggleAll").addEventListener("click", () => {
        const all = document.querySelectorAll("details.source");
        const open = ![...all].every((d) => d.open);
        all.forEach((d) => {
          d.open = open;
        });
        syncToggleLabel();
      });

      // ---------- Submit ----------
      function errorText(detail) {
        if (!detail) return "Query failed";
        return typeof detail === "string" ? detail : JSON.stringify(detail);
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const question = questionInput.value.trim();
        if (!question) return;

        submitBtn.disabled = true;
        submitBtn.textContent = "Asking…";
        $("loading").style.display = "block";
        $("result").style.display = "none";
        $("error").style.display = "none";

        try {
          const response = await fetch("/query", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question }),
          });

          if (!response.ok) {
            const err = await response.json().catch(() => ({}));
            throw new Error(errorText(err.detail));
          }

          const data = await response.json();
          const sources = data.sources || [];

          if (sources.length > 0) {
            renderSources(sources);
          } else {
            $("sources").style.display = "none";
          }

          renderMarkdown(data.answer, $("answer"), sources.length);

          const m = data.metadata || {};
          $("metadata").textContent = [m.model, `${m.chunks_retrieved ?? 0} retrieved`, `${m.chunks_used ?? 0} used`, m.response_time_ms != null ? `${(m.response_time_ms / 1000).toFixed(1)} s` : null].filter(Boolean).join(" · ");

          $("result").style.display = "block";
        } catch (err) {
          $("error").textContent = `Error: ${err.message}`;
          $("error").style.display = "block";
        } finally {
          $("loading").style.display = "none";
          submitBtn.disabled = false;
          submitBtn.textContent = "Ask";
        }
      });
    </script>
  </body>
</html>
