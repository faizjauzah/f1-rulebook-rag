# Local-only configuration. Embeddings and generation are served by an
# OpenAI-compatible server on your machine (LM Studio by default). There is no
# cloud provider to switch to; `base_url` must point at a local endpoint.

embedding:
  base_url: "http://host.docker.internal:1234/v1"   # LM Studio, as seen from inside Docker
  model: "text-embedding-bge-large-en-v1.5"

llm:
  base_url: "http://host.docker.internal:1234/v1"
  model: "google/gemma-4-e4b"
  temperature: 0.1

collection: "f1-regs"

top_k: 5
similarity_threshold: 0.6
pdf_directory: "PDFs"
